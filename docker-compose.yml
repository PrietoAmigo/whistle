services:
  whistle:
    build: .
    image: whistle:latest
    ports:
      - "8000:8000"
    environment:
      # Each worker is a process with its own copy of the model (~17 MB), so
      # raise this to transcribe several requests at once.
      WHISTLE_WORKERS: "1"
      WHISTLE_MAX_AUDIO_SECONDS: "3600"
    restart: unless-stopped
